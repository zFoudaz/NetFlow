[package]
name = "netflow-tauri"
version = "1.1.0"
edition = "2021"

[lib]
name = "netflow_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "netflow-tauri"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
netflow-core = { path = "../crates/netflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
